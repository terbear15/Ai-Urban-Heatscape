<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeatScape · Choose a city</title>
<link rel="stylesheet" href="heatscape.css?v=1">
<style>
main{max-width:1200px;padding-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 22px}
.city{text-decoration:none;color:var(--ink);display:block}
.frame{aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2) center/cover no-repeat;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.city:hover .frame,.city:focus-visible .frame{transform:translateY(-3px)}
.city:focus-visible{outline:2px solid var(--focus);outline-offset:6px;border-radius:var(--radius)}
.name{font:600 16px Manrope,Arial;letter-spacing:-.3px;margin:12px 2px 0}
.tag{font-size:11px;color:var(--muted);margin:3px 2px 0}
.tag.first{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header class="hs-header"><a class="hs-brand" href="./" aria-label="HeatScape home"><svg class="hs-mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="sun" cx="16" cy="16" r="14"/><path class="shade" d="M16 2a14 14 0 0 1 0 28z"/></svg>HeatScape</a><div class="hs-season" role="group" aria-label="Season"><button type="button" id="summerMode" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="label">Summer</span></button><button type="button" id="winterMode" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M9.5 4l2.5 2 2.5-2M9.5 20l2.5-2 2.5 2"/></svg><span class="label">Winter</span></button></div><label class="hs-city" for="citySelect"><span>CITY</span><select id="citySelect" aria-label="City"><option value="">Choose a city</option></select></label></header>
<main>
  <div class="intro">
    <div class="eyebrow">CITY WALKING MAPS</div>
    <h1>Choose a city</h1>
    <p>Each square shows the city's satellite view. Walking routes are available in every city; each city covers its downtown and busiest visitor areas.</p>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer><span>Imagery © Esri and contributors · <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></span><span>Walking routes: FOSSGIS</span></footer>
<script src="site.js?v=1"></script>
<script>
const ARCGIS_EXPORT = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export';

// Square satellite crop centred on a city's bounds, so every frame has the same shape.
function squareThumb([[w, s], [e, n]]) {
  const cx = (w + e) / 2, cy = (s + n) / 2;
  const half = Math.max(e - w, n - s) / 2 * 1.08;
  const bbox = [cx - half, cy - half, cx + half, cy + half].join(',');
  const url = new URL(ARCGIS_EXPORT);
  url.search = new URLSearchParams({bbox, bboxSR: '4326', imageSR: '4326', size: '480,480', format: 'jpg', f: 'image'});
  return url.href;
}

async function build() {
  const views = await (await fetch('cities/views.json')).json();
  // views.json is stored in order of metro GDP.
  const slugs = Object.keys(views);
  const grid = document.getElementById('grid');
  for (const slug of slugs) {
    const city = views[slug];
    const link = document.createElement('a');
    link.className = 'city';
    link.href = (city.shade ? 'shade.html' : 'cities.html') + '?city=' + slug;
    link.setAttribute('aria-label', 'Open ' + city.name + ' walking map');

    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.backgroundImage = 'url("' + squareThumb(city.bounds) + '")';
    frame.setAttribute('role', 'img');
    frame.setAttribute('aria-label', city.name + ' satellite view');

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = city.name;

    const tag = document.createElement('div');
    tag.className = 'tag' + (city.shade ? ' first' : '');
    tag.textContent = city.shade ? 'Building and tree shade' : 'Walking routes';

    link.append(frame, name, tag);
    grid.append(link);
  }
}
build().catch(() => {
  document.getElementById('grid').textContent = 'The city list could not be loaded. Please refresh the page.';
});
</script>
</body>
</html>
