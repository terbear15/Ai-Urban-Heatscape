<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeatScape · City walking maps</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Compare walking routes by sun and shade from buildings and LiDAR-measured trees in twenty US city centers.">
<meta property="og:title" content="HeatScape · City walking maps">
<meta property="og:description" content="Find the shadier way: walking routes compared by sun and shade.">
<meta property="og:image" content="https://terbear15.github.io/Ai-Urban-Heatscape/dist/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="heatscape.css?v=062e8cc">
</head>
<body>
<header class="hs-header"><a class="hs-brand" href="./" aria-label="HeatScape home"><svg class="hs-mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="ring" cx="16" cy="16" r="12.5"/><circle class="dot" cx="16" cy="16" r="7"/></svg>HeatScape</a><div class="hs-season" role="group" aria-label="Season"><button type="button" id="summerMode" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="label">Summer</span></button><button type="button" id="winterMode" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M9.5 4l2.5 2 2.5-2M9.5 20l2.5-2 2.5 2"/></svg><span class="label">Winter</span></button></div><label class="hs-city" for="citySelect"><span>CITY</span><select id="citySelect" aria-label="City"><option value="">Choose a city</option></select></label></header>
<main>
<div class="intro"><div><div class="eyebrow">CITY WALKING MAPS</div><h1 id="city-name">Explore a city</h1><p id="coverage"></p></div></div>
<section class="workspace" aria-label="Walking route explorer">
<aside>
<h2>Where are you headed?</h2>
<form id="walk">
<label for="start">STARTING POINT</label>
<div class="location-field"><input id="start" type="search" placeholder="Street address or place" autocomplete="off"><button type="button" id="start-search" aria-label="Search starting point" title="Search starting point">↵</button></div>
<div id="start-matches" class="location-matches" hidden></div>
<div class="route-connector">⋮</div>
<label for="end">DESTINATION</label>
<div class="location-field"><input id="end" type="search" placeholder="Street address or place" autocomplete="off"><button type="button" id="end-search" aria-label="Search destination" title="Search destination">↵</button></div>
<div id="end-matches" class="location-matches" hidden></div>
<div class="pick-row"><button type="button" id="pick-start">⌖ Pick start on map</button><button type="button" id="pick-end">⚑ Pick destination</button></div>
<button class="primary" id="calculate" type="submit">Find walking route <span>↗</span></button>
</form>
<p class="small" id="status" role="status">Loading the city map…</p>
<div id="results" aria-live="polite"></div>
</aside>
<div class="map-panel">
<div class="map-heading"><h2 id="map-title">City overview</h2></div>
<div class="map-stage">
<div id="map" aria-label="Interactive city map"></div>
<div class="map-buttons"><button id="overview" type="button">Whole area</button></div>
</div>
</div>
</section>
<footer><span><a href="https://www.census.gov/geographies/mapping-files/2024/geo/carto-boundary-file.html">Census 2024 display boundaries</a> · <a href="https://routing.openstreetmap.de/about.html">FOSSGIS pedestrian routing</a> · Photon search</span><a href="https://www.openstreetmap.org/fixthemap">Fix the map</a></footer>
</main>
<script src="vendor/maplibre-gl.js?v=062e8cc"></script>
<script src="site.js?v=062e8cc"></script>
<script src="cities.js?v=062e8cc"></script>
</body>
</html>
