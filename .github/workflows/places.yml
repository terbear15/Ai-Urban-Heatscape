name: Build Center City places

on:
  workflow_dispatch:
  push:
    branches: [philly-shade-page]
    paths: [python/osm_api.py, python/build_places.py, .github/workflows/places.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely requests
      - run: python python/build_places.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist/location/center-city-places.js
          git diff --cached --quiet || git commit -m "Build Center City place index from OpenStreetMap"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
