name: Build Center City shade data

# OSM buildings and walking network, then LiDAR tree canopy heights, for Center City, Philadelphia.
on:
  workflow_dispatch:
  push:
    branches: [philly-shade-page]
    paths: [python/build_center_city_data.py, python/prepare_lidar_canopy.py, .github/workflows/center-city-data.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "laspy[lazrs]" numpy rasterio scipy shapely pyproj requests
      - name: OSM buildings and walking network
        run: python python/build_center_city_data.py
      - name: LiDAR tree canopy heights
        run: python python/prepare_lidar_canopy.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist/philly-data.js dist/location/lidar-canopy.geojson dist/location/lidar-summary.json
          git diff --cached --quiet || git commit -m "Build Center City shade data (OSM buildings, network, LiDAR trees)"
          git pull --rebase
          git push
