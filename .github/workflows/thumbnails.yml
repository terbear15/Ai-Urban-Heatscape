name: Explore satellite thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [python/make_satellite.py]
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pillow
      - run: python python/make_satellite.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist/thumbs
          git diff --cached --quiet || git commit -m "Explore thumbnails"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
