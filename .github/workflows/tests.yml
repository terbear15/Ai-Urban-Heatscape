name: Engine tests
on:
  push:
    paths: [dist/engine.js, tests/**, .github/workflows/tests.yml]
  pull_request:
    paths: [dist/engine.js, tests/**]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/engine.test.cjs
