name: Build Center City boundary

on:
  workflow_dispatch:
  push:
    branches: [philly-shade-page]
    paths: [python/prepare_center_city.py, .github/workflows/center-city.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely requests
      - run: python python/prepare_center_city.py
        continue-on-error: true
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist/location
          git diff --cached --quiet || git commit -m "Build Center City boundary from Philadelphia neighborhoods"
          git push
